# One address for everything (http://localhost:8080 under docker compose):
#   /            the React app (static files)
#   /api/        forwarded to a backend copy
#   /socket.io/  WebSocket, forwarded to a backend copy and kept open
#
# This is the load balancer. "least_conn" sends each new connection to the copy with the fewest
# open connections — suits long-lived WebSockets, and spreads two users across two copies.
# Docker's internal DNS. Backend containers get a new IP address whenever they are recreated, so
# addresses are re-checked every 5 s instead of being fixed when nginx starts.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream backend {
    zone backend 64k;
    least_conn;
    # "resolve" keeps each address current. If a copy refuses connections (e.g. it is shutting
    # down), skip it for 5 s.
    server backend-a:5001 resolve max_fails=1 fail_timeout=5s;
    server backend-b:5001 resolve max_fails=1 fail_timeout=5s;
}

# Pass WebSocket upgrades through; plain requests get a normal keep-alive connection
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# A stopped backend container doesn't refuse connections — its address just goes silent, and
# nginx would wait the default 60 s before trying the other copy. On this private network a
# healthy copy answers in well under a millisecond, so give up after 2 s and move on.
proxy_connect_timeout 2s;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Health of this container itself
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A copy that is going away answers 502/503 or refuses: retry on the other one
        proxy_next_upstream error timeout http_502 http_503;
    }

    location /socket.io/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # WebSockets stay open for as long as the user is on the page
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_next_upstream error timeout;
    }

    # Built files have content hashes in their names, so they can be cached for a long time
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: every other path is handled by React Router
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
