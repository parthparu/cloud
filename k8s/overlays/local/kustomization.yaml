apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Resources listed directly in THIS file (postgres.yaml, configmap.yaml) don't inherit base's
# own `namespace:` field — each kustomization.yaml's namespace applies only to resources it lists
# itself. Restating it here caught a real bug: without this, postgres landed in "default".
namespace: chatscale
resources:
  - ../../base
  - postgres.yaml
  - configmap.yaml
secretGenerator:
  - name: backend-secret
    envs:
      - secret.env   # generated by scripts/k8s-up.sh, gitignored — never commit real secrets
generatorOptions:
  disableNameSuffixHash: true
