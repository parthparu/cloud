# Template only — never commit real values. The local overlay generates this for you
# (scripts/k8s-up.sh); for a real cluster, copy this file, fill it in, and apply it directly
# (kubectl apply -f secret.yaml), keeping it out of git.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
type: Opaque
stringData:
  JWT_SECRET: change-me-to-a-long-random-string
  TWO_FACTOR_KEY: change-me-to-a-long-random-string
  # Omit DATABASE_URL to use the in-cluster Postgres (local overlay). Set it to point elsewhere.
  # DATABASE_URL: ""
