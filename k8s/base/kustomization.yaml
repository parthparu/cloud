apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: chatscale
resources:
  - namespace.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-nginx-configmap.yaml
  - frontend-deployment.yaml
  - redis.yaml
  - prometheus.yaml
  - grafana.yaml
  - prometheus-adapter.yaml
  - ingress.yaml
# backend-config and backend-secret come from an overlay (local/ or azure/), which knows which
# database to use. The base intentionally does not define them, so it can never accidentally ship
# a default.
