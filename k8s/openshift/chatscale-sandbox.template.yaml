# ChatScale for the Red Hat Developer Sandbox — ONE file for the web console's "Import YAML".
#
# THIS IS A TEMPLATE. The three secret values below are placeholders; don't upload it as-is. Run
#   ./scripts/openshift-make-yaml.sh
# to produce ~/Downloads/chatscale-openshift.yaml with fresh random values (that file is the one
# to upload — it contains secrets, so it is kept out of git). Steps: docs/OPENSHIFT.md.
#
# What it creates, all inside the project you have selected (it names no namespace on purpose):
#   - 2 image builds, run INSIDE the cluster from the public GitHub repo (so the images match the
#     cluster's CPU type — this Mac is arm64, the sandbox is almost certainly x86_64)
#   - PostgreSQL (OpenShift-friendly Red Hat image + a small disk), Redis (the shared message board)
#   - the backend (2 copies — the whole point of the experiment) and the frontend (nginx)
#   - a public HTTPS address (a "Route") for the frontend
#
# Sized to fit a small quota (the sandbox is reported to allow ~3 CPU cores / 14 GB, unverified):
# at most ~1.2 CPU of limits while running, and the two builds add 1.5 more only while they run.
# CPU limits this low throttle heavy load tests; fine for the demo. Raise them if the quota allows.
#
# Not in this file, deliberately: prometheus-adapter / anything cluster-wide (a shared sandbox
# won't allow it), and demo users with a known password (SEED_DEMO_DATA=false — this app will be
# reachable from the internet, so people sign up themselves).
---
apiVersion: v1
kind: Secret
metadata:
  name: chatscale-secrets
  labels: { app.kubernetes.io/part-of: chatscale }
type: Opaque
stringData:
  JWT_SECRET: "__JWT_SECRET__"
  TWO_FACTOR_KEY: "__TWO_FACTOR_KEY__"
  POSTGRESQL_PASSWORD: "__DB_PASSWORD__"
  DATABASE_URL: "postgres://chatscale:__DB_PASSWORD__@postgresql:5432/chatscale?sslmode=disable"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  labels: { app.kubernetes.io/part-of: chatscale }
data:
  # The Redis adapter is ON when this is set. To reproduce the original failure on OpenShift, set
  # it to "" (empty) and restart the backend; set it back to turn the fix on again.
  REDIS_URL: redis://redis:6379
  SEED_DEMO_DATA: "false"
  SHUTDOWN_DRAIN_SECONDS: "3"
  UPLOADS_DIR: /tmp/uploads
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-conf
  labels: { app.kubernetes.io/part-of: chatscale }
data:
  default.conf: |
    # Compress text files. Measured from India to the US-East sandbox: the 296 KB JavaScript bundle
    # took 3.4 s uncompressed; every request there already costs ~1 s of pure distance, so sending
    # fewer bytes is the one part of "slow" that is ours to fix. (Images aren't listed: already compressed.)
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/css text/plain application/javascript text/javascript application/json image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        location /api/ {
            proxy_pass http://backend:5001;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_next_upstream error timeout http_502 http_503;
        }

        location /socket.io/ {
            proxy_pass http://backend:5001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_next_upstream error timeout;
        }

        location /static/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            try_files $uri /index.html;
            add_header Cache-Control "no-cache";
        }
    }
---
# ---------------------------------------------------------------- image builds
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: chatscale-backend
  labels: { app.kubernetes.io/part-of: chatscale }
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: chatscale-web
  labels: { app.kubernetes.io/part-of: chatscale }
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: chatscale-backend
  labels: { app.kubernetes.io/part-of: chatscale }
spec:
  source:
    type: Git
    git: { uri: "https://github.com/parthparu/cloud.git", ref: main }
    contextDir: backend
  strategy:
    type: Docker
    dockerStrategy: {}
  output:
    to: { kind: ImageStreamTag, name: "chatscale-backend:latest" }
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: 500m, memory: 1Gi }
  triggers:
    - type: ConfigChange   # starts the first build as soon as this file is imported
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: chatscale-web
  labels: { app.kubernetes.io/part-of: chatscale }
spec:
  source:
    type: Git
    git: { uri: "https://github.com/parthparu/cloud.git", ref: main }
    contextDir: frontend
  strategy:
    type: Docker
    dockerStrategy: {}
  output:
    to: { kind: ImageStreamTag, name: "chatscale-web:latest" }
  # The React production build is the memory-hungry step of the whole project
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: "1", memory: 3Gi }
  triggers:
    - type: ConfigChange
---
# ---------------------------------------------------------------- PostgreSQL
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-data
  labels: { app.kubernetes.io/part-of: chatscale }
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests: { storage: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  labels: { app: postgresql, app.kubernetes.io/part-of: chatscale }
spec:
  replicas: 1
  strategy: { type: Recreate }   # one disk can't be attached to two pods at once
  selector:
    matchLabels: { app: postgresql }
  template:
    metadata:
      labels: { app: postgresql }
    spec:
      containers:
        - name: postgresql
          # Red Hat's PostgreSQL image is built to run as the random user OpenShift assigns; the
          # official postgres image is not
          image: quay.io/sclorg/postgresql-16-c9s:latest
          ports:
            - containerPort: 5432
          env:
            - { name: POSTGRESQL_USER, value: chatscale }
            - { name: POSTGRESQL_DATABASE, value: chatscale }
            - name: POSTGRESQL_PASSWORD
              valueFrom: { secretKeyRef: { name: chatscale-secrets, key: POSTGRESQL_PASSWORD } }
          volumeMounts:
            - { name: data, mountPath: /var/lib/pgsql/data }
          readinessProbe:
            exec: { command: ["/bin/sh", "-c", "pg_isready -h 127.0.0.1 -p 5432"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 300m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgresql-data }
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  labels: { app.kubernetes.io/part-of: chatscale }
spec:
  selector: { app: postgresql }
  ports:
    - { port: 5432, targetPort: 5432 }
---
# ---------------------------------------------------------------- Redis (the fix)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: { app: redis, app.kubernetes.io/part-of: chatscale }
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: quay.io/sclorg/redis-7-c9s:latest
          ports:
            - containerPort: 6379
          volumeMounts:
            - { name: data, mountPath: /var/lib/redis/data }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 100m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: data
          emptyDir: {}   # a message board, not a database: nothing here needs to survive a restart
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: { app.kubernetes.io/part-of: chatscale }
spec:
  selector: { app: redis }
  ports:
    - { port: 6379, targetPort: 6379 }
---
# ---------------------------------------------------------------- backend (2 copies)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels: { app: backend, app.kubernetes.io/part-of: chatscale }
  annotations:
    # Once the image build finishes, OpenShift swaps the real image into this Deployment by itself
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"chatscale-backend:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"backend\")].image"}]
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      terminationGracePeriodSeconds: 20
      initContainers:
        # The backend exits if its database isn't up yet; waiting here avoids a crash-restart loop
        - name: wait-for-database
          image: quay.io/sclorg/postgresql-16-c9s:latest
          command: ["/bin/sh", "-c", "until pg_isready -h postgresql -p 5432; do echo waiting for postgresql; sleep 2; done"]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 50m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
      containers:
        - name: backend
          image: chatscale-backend:latest   # placeholder, replaced by the trigger above
          ports:
            - containerPort: 5001
          envFrom:
            - configMapRef: { name: backend-config }
          env:
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: chatscale-secrets, key: JWT_SECRET } }
            - name: TWO_FACTOR_KEY
              valueFrom: { secretKeyRef: { name: chatscale-secrets, key: TWO_FACTOR_KEY } }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: chatscale-secrets, key: DATABASE_URL } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 300m, memory: 256Mi }
          livenessProbe:
            httpGet: { path: /healthz, port: 5001 }
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: 5001 }
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            preStop:
              exec: { command: ["sleep", "3"] }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels: { app.kubernetes.io/part-of: chatscale }
spec:
  selector: { app: backend }
  ports:
    - { port: 5001, targetPort: 5001 }
---
# ---------------------------------------------------------------- frontend + public address
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: { app: frontend, app.kubernetes.io/part-of: chatscale }
  annotations:
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"chatscale-web:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"frontend\")].image"}]
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: chatscale-web:latest   # placeholder, replaced by the trigger above
          ports:
            - containerPort: 8080
          volumeMounts:
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf }
          readinessProbe:
            httpGet: { path: /nginx-health, port: 8080 }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: nginx-conf
          configMap: { name: frontend-nginx-conf }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels: { app.kubernetes.io/part-of: chatscale }
spec:
  selector: { app: frontend }
  ports:
    - { port: 8080, targetPort: 8080 }
---
# OpenShift's version of an Ingress: a public HTTPS address, with the host name made up for you
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: chatscale
  labels: { app.kubernetes.io/part-of: chatscale }
  annotations:
    # Live chat connections are long-lived; the router's default would cut them off after ~30s of silence
    haproxy.router.openshift.io/timeout: 1h
    haproxy.router.openshift.io/timeout-tunnel: 1h
spec:
  to: { kind: Service, name: frontend }
  port: { targetPort: 8080 }
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
